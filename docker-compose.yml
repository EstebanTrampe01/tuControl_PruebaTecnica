services:
  db:
    image: postgres:16-alpine
    container_name: tucontrol_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: tucontrol
      POSTGRES_USER: tucontrol_user
      POSTGRES_PASSWORD: tucontrol_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tucontrol_user -d tucontrol"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tucontrol_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://tucontrol_user:tucontrol_pass@db:5432/tucontrol
      CI: "true"
    ports:
      - "3001:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "pnpm install && pnpm run start:dev"
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tucontrol_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      API_URL_INTERNAL: http://backend:3000
      CI: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: sh -c "pnpm install && pnpm run dev"
volumes:
  postgres_data:
